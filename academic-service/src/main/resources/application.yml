server:
  port: ${ACADEMIC_SERVICE_PORT:8082}

spring:
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      properties:
        spring.json.add.type.headers: false
  datasource:
    url: ${ACADEMIC_DB_URL:jdbc:postgresql://localhost:5433/academic_db}
    username: ${ACADEMIC_DB_USER:academic_user}
    password: ${ACADEMIC_DB_PASSWORD:academic_pass}
  jpa:
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
    locations: classpath:db/migration

jwt:
  secret: ${JWT_SECRET:changeme-this-is-a-very-long-dev-secret-key-32chars}

kafka:
  topics:
    academic-events: academic-events

app:
  kafka:
    topic:
      replication-factor: ${KAFKA_TOPIC_REPLICATION_FACTOR:1}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      show-details: always
  metrics:
    export:
      prometheus:
        enabled: true

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html