server:
  port: ${AUDIT_SERVICE_PORT:8084}

spring:
  application:
    name: audit-service

  datasource:
    url: ${AUDIT_DB_URL:jdbc:postgresql://localhost:5432/audit_db}
    username: ${AUDIT_DB_USER:audit_user}
    password: ${AUDIT_DB_PASSWORD:audit_pass}

  jpa:
    hibernate:
      ddl-auto: validate

  flyway:
    enabled: true
    locations: classpath:db/migration

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}

jwt:
  secret: ${JWT_SECRET:changeme-this-is-a-very-long-dev-secret-key-32chars}

kafka:
  consumer:
    group-id: ${AUDIT_KAFKA_GROUP_ID:audit-service-group}
    auto-offset-reset: ${AUDIT_KAFKA_AUTO_OFFSET_RESET:earliest}

  topics:
    academic-events: ${ACADEMIC_EVENTS_TOPIC:academic-events}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html