apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: postgres-notification-pvc
  namespace: university-platform
  labels:
    app: postgres-notification
    part-of: university-platform
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres-notification
  namespace: university-platform
  labels:
    app: postgres-notification
    part-of: university-platform
spec:
  replicas: 1
  selector:
    matchLabels:
      app: postgres-notification
  template:
    metadata:
      labels:
        app: postgres-notification
        part-of: university-platform
    spec:
      containers:
        - name: postgres-notification
          image: postgres:16-alpine
          ports:
            - containerPort: 5432
          env:
            - name: POSTGRES_DB
              value: "notification_db"
            - name: POSTGRES_USER
              value: "notification_user"
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: university-secrets
                  key: notification-db-password
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: postgres-notification-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: postgres-notification
  namespace: university-platform
  labels:
    app: postgres-notification
    part-of: university-platform
spec:
  type: ClusterIP
  selector:
    app: postgres-notification
  ports:
    - port: 5432
      targetPort: 5432
