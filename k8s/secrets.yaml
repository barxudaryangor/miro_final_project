# Generate base64 values with:
#   echo -n 'value' | base64
#
# Example:
#   echo -n 'auth_pass'    | base64   -> YXV0aF9wYXNz
#   echo -n 'academic_pass'| base64   -> YWNhZGVtaWNfcGFzcw==
#   echo -n 'notif_pass'   | base64   -> bm90aWZfcGFzcw==
#   echo -n 'audit_pass'   | base64   -> YXVkaXRfcGFzcw==
#   echo -n 'changeme-this-is-a-very-long-dev-secret-key-32chars' | base64
apiVersion: v1
kind: Secret
metadata:
  name: university-secrets
  namespace: university-platform
type: Opaque
data:
  auth-db-password: YXV0aF9wYXNz
  academic-db-password: YWNhZGVtaWNfcGFzcw==
  notification-db-password: bm90aWZfcGFzcw==
  audit-db-password: YXVkaXRfcGFzcw==
  jwt-secret: Y2hhbmdlbWUtdGhpcy1pcy1hLXZlcnktbG9uZy1kZXYtc2VjcmV0LWtleS0zMmNoYXJz
