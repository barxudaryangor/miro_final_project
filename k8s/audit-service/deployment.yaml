apiVersion: apps/v1
kind: Deployment
metadata:
  name: audit-service
  namespace: university-platform
  labels:
    app: audit-service
    part-of: university-platform
spec:
  replicas: 1
  selector:
    matchLabels:
      app: audit-service
  template:
    metadata:
      labels:
        app: audit-service
        part-of: university-platform
    spec:
      enableServiceLinks: false
      containers:
        - name: audit-service
          image: localhost/university-platform/audit-service:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8084
          envFrom:
            - configMapRef:
                name: university-config
          env:
            - name: AUDIT_DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: university-secrets
                  key: audit-db-password
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: university-secrets
                  key: jwt-secret
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          livenessProbe:
            httpGet:
              path: /actuator/health
              port: 8084
            initialDelaySeconds: 90
            periodSeconds: 10
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: 8084
            initialDelaySeconds: 60
            periodSeconds: 10
            failureThreshold: 3