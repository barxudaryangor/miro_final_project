
global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:

  - job_name: auth-service
    metrics_path: /actuator/prometheus
    static_configs:
      - targets:
          - auth-service:8081

  - job_name: academic-service
    metrics_path: /actuator/prometheus
    static_configs:
      - targets:
          - academic-service-1:8082
          - academic-service-2:8082

  - job_name: notification-service
    metrics_path: /actuator/prometheus
    static_configs:
      - targets:
          - notification-service:8083

  - job_name: audit-service
    metrics_path: /actuator/prometheus
    static_configs:
      - targets:
          - audit-service:8084
